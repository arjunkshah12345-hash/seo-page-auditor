[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-auditor"
version = "0.2.0"
description = "AI Search & Readability Auditor: checks whether AI search and fetch tools can read and understand a live page, and ties that to search visibility. Built on TinyFish Search, Fetch, and Agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arjun Shah" }]
keywords = ["seo", "ai-search", "geo", "tinyfish", "audit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
seo-audit = "seo_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["seo_auditor"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
